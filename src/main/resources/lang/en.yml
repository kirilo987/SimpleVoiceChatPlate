    cache_clear: "<color:#FF8A80>/svcplate cache clear</color> <color:#B0BEC5>— Purge the audio cache</color>"
    updatedeps: "<color:#FF8A80>/svcplate updatedeps</color> <color:#B0BEC5>— Force-update the yt-dlp binary</color>"
    reload: "<color:#FF8A80>/svcplate reload</color> <color:#B0BEC5>— Reload configuration and language files</color>"
