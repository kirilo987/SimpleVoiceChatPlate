# Full MiniMessage formatting (<gradient>, <color>, <hover>, etc.) is supported.
# Set any message value to "" to completely suppress sending that notification.

prefix: "<gradient:#00E5FF:#7C4DFF><b>SimpleVoiceChatPlate</b></gradient> <color:#607D8B>»</color> "

defaults:
  track_title: "Music Track"
  gdrive_track: "Google Drive Track"
  unknown: "Unknown"

# Simple Voice Chat's network protocol (AddCategoryPacket) strictly caps category_*_name at 16 UTF-8 bytes
# (max 16 ASCII characters or 8 Cyrillic characters). Longer details belong in category_*_desc (up to 256 UTF-8 bytes).
voicechat:
  category_music_name: "Music Discs"
  category_music_desc: "Volume of SimpleVoiceChatPlate custom music discs"
  category_horn_name: "Soundpad Horns"
  category_horn_desc: "Volume of custom goat horns and portable player"

commands:
  help_header: "<color:#00E5FF>Available <b>SimpleVoiceChatPlate</b> commands:</color>"
  help_admin_header: "<color:#FF5252>Admin commands:</color>"
  help_lines:
    burn: "<color:#00E5FF>/svcplate burn <url> [title]</color> <color:#B0BEC5>— Burn a track or playlist onto an item</color>"
    erase: "<color:#00E5FF>/svcplate erase</color> <color:#B0BEC5>— Erase custom audio from the item in hand</color>"
    search: "<color:#00E5FF>/svcplate search <query></color> <color:#B0BEC5>— Search YouTube tracks in-game</color>"
    horn: "<color:#00E5FF>/svcplate horn <volume|distance|duration|mode|notify|info></color> <color:#B0BEC5>— Configure goat horn & notifications</color>"
    cancel: "<color:#00E5FF>/svcplate cancel</color> <color:#B0BEC5>— Stop your active horn or portable player</color>"
