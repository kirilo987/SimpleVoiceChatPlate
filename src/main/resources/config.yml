settings:
  # Язык интерфейса, сообщений, описания предметов и меню плеера.
  # Все языковые файлы хранятся в папке plugins/SimpleVoiceChatPlate/lang/ (по умолчанию доступны "ru" и "en").
  # Вы можете переключить язык на "en" или создать свой файл (например, lang/de.yml -> language: "de")
  # и применить изменения без перезапуска сервера командой /svcplate reload.
  language: "ru"
  debug: false

logging:
  create_crash_reports: true
  file_logging: true
  retention_days: 14

# Тракт декодирования, мастеринга и потокового кодирования звука (48 кГц, 16-бит PCM -> Opus).
#   • quality_preset:
#       "ultra"    — максимальное студийное качество: выбор потоков 48 кГц Opus 160+ кбит/с, фазолинейная
#                    sinc-передискретизация (64-tap Kaiser) и бережное сведение стерео-панорамы без потери верхов.
#       "high"     — высокое качество со стандартным ресэмплером (меньше нагрузка на CPU при конвертации).
#       "balanced" — экономия места в кэше и трафика.
#       "raw"      — прямое декодирование без каких-либо фильтров и лимитеров FFmpeg (нетронутая волна).
#   • opus_mode:
#       "AUDIO" — широкополосный музыкальный кодек CELT (20 Гц – 20 кГц, чистые высокие частоты и плотный бас).
#       "VOIP"  — речевой профиль (не рекомендуется для музыки, так как срезает края спектра под голос).
#   • initial_buffer_seconds — объем предзагрузки (в секундах), после которого трек сразу начинает играть
#     в потоковом режиме, пока остальная часть аудиофайла докачивается в фоне.
audio:
  ffmpeg_path: ""
  quality_preset: "ultra"
  opus_mode: "AUDIO"
  output_gain: 1.0
  normalize_audio: true
  custom_ffmpeg_filter: ""
  initial_buffer_seconds: 1.5
  loading_animation_ticks: 8
  max_length_seconds: 1800
  max_download_size_bytes: 52428800
  max_concurrent_processes: 4

# Двунаправленная система упреждающей подгрузки плейлистов (Bidirectional Sliding-Window Prefetch).
#   • initial_ready_tracks — сколько первых треков достаточно получить от YouTube, чтобы пластинка сразу стала
#     готовой к проигрыванию, пока остальной список треков (до max_tracks) догружается в фоновом режиме.
#   • head_preload_seconds — длительность предзагружаемого вступления («начала») для соседних песен окна
#     (prefetch_next_tracks вперед и prefetch_previous_tracks назад). При переключении трека кнопками ⏭ / ⏮
#     воспроизведение стартует мгновенно (0 мс) из предзагруженного начала с бесшовной подхваткой полного файла.
playlist:
  max_tracks: 100
  initial_ready_tracks: 3
  prefetch_next_tracks: 3
  prefetch_previous_tracks: 2
  head_preload_seconds: 12

# Физический движок 3D-акустики реального времени.
# При прямой видимости (без преград между источником и игроком) сигнал идет по чистому тракту без окрашивания спектра.
# Когда между проигрывателем и игроком появляются блоки или вода, включается индивидуальная DSP-обработка:
#   • through_walls + wall_muffle_strength — воксельная трассировка луча (3D DDA) рассчитывает толщину и материал
#     преграды, срезая верхние частоты каскадным фильтром Баттерворта 24 дБ/окт.
#   • wall_bass_resonance + min_wall_gain — моделируют структурную вибрацию саб-баса (~95 Гц) сквозь каменные стены.
#   • diffraction_enabled — звуковая волна огибает углы коридоров, открытые двери и окна, смещая 3D-точку источника
#     в сторону проема с сохранением клиентского OpenAL HRTF-позиционирования.
acoustics:
  enabled: true
  through_walls: true
  diffraction_enabled: true
  room_reverb_enabled: false
  air_absorption_enabled: false
  underwater_muffle: true
  wall_muffle_strength: 1.0
  wall_bass_resonance: 0.85
  min_wall_gain: 0.04
  update_interval_ticks: 3

folders:
  cache: "cache"

cache:
  auto_cleanup: true
  retention_days: 7
  cleanup_delay_ticks: 1200

# Настройки загрузчика YouTube (yt-dlp).
# Плагин сначала использует нативный профиль yt-dlp с наивысшим битрейтом аудио, а при блокировке HTTP 403
# автоматически перебирает резервные профили из player_clients. Для видео 18+ и обхода жестких блокировок
# дата-центров поместите файл cookies.txt (формат Netscape) в папку plugins/SimpleVoiceChatPlate/cookies.txt.
youtube:
  enabled: true
  ytdlp_path: ""
  player_clients: "mweb,web,ios,android"
  extractor_args: ""
  auto_update: true

blacklist:
  domains:
    - "localhost"
    - "127.0.0.1"
    - "0.0.0.0"

jukebox:
  volume_multiplier: 0.75
  distance: 65.0
  drop_disc_on_break: true
  show_loading_animation: true
  show_playing_notification: true
  # Система акустической пирамиды-усилителя под проигрывателем (по принципу Маяка).
  # Полные слои 3x3, 5x5, 7x7 и 9x9 под блоком проигрывателя из железных, золотых, медных, изумрудных,
  # алмазных или незеритовых блоков расширяют радиус слышимости согласно списку beacon_like_distances:
  # индекс 0 — без пирамиды, индексы 1..4 — от 1 до 4 полных уровней пирамиды соответственно.
  enable_beacon_like_distance: true
  beacon_like_distances:
    - 48
    - 64
    - 84
    - 108
    - 136

goat_horn:
  enabled: true
  volume_multiplier: 0.85
  distance: 24.0
  max_duration_seconds: 15
  cooldown_ticks: 100
  default_mode: "toggle"
  show_loading_animation: true
  show_playing_notification: true
  show_stopped_notification: true

portable_player:
  enabled: false
  volume_multiplier: 0.60
  distance: 18.0
  show_loading_animation: true
  show_playing_notification: true
  show_stopped_notification: true

anvil:
  enabled: true
  shears_damage: 34

# Защита экономики выживания: если require_burnable_tag: true, игроки не смогут перезаписывать обычные пластинки
# из данжей — для записи потребуется специальная «чистая» пластинка с NBT/PDC-меткой burnable (ее можно выдавать
# через кастомные крафты/магазины либо включить встроенный бесформенный рецепт enable_default_recipe).
# Игроки с правом simplevoicechatplate.burn.bypass игнорируют это ограничение.
burnable_tag:
  require_burnable_tag: false
  enable_default_recipe: false
  default_recipe_item: "minecraft:diamond"
  default_recipe_cost: 4
  default_recipe_lore: "<aqua>Чистая пластинка для записи</aqua>"

gui:
  rewind_seconds: 15
  volume_small_step: 0.05
  volume_large_step: 0.15
  progress_bar_length: 22

# Персональные квоты создания кастомных записей на одного игрока (при стирании записи через /svcplate erase
# или ножницами в наковальне слот квоты автоматически возвращается создателю пластинки).
# Для переопределения лимитов через LuckPerms выдайте право: simplevoicechatplate.limit.<тип>.<число>
# (например: simplevoicechatplate.limit.single.20 или simplevoicechatplate.limit.playlist.-1 для безлимита).
limits:
  single: 5
  playlist: 2
  horn: 3
