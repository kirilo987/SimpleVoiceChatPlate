# ======================================================================================================================
#                                         SimpleVoiceChatPlate — Конфигурация
#                                               Автор плагина: Kxysl1k
#                            Платформа: Paper / Folia 26.3+ • Интеграция: Simple Voice Chat
# ======================================================================================================================
# В этом файле максимально подробно расписана КАЖДАЯ настройка и КАЖДАЯ строчка плагина.
# После изменения любых параметров сохраните файл в кодировке UTF-8 и выполните команду:
#   /svcplate reload  (или /disc reload)
# Перезапуск всего сервера НЕ требуется — все настройки, лимиты, акустика и языки применятся мгновенно.
# ======================================================================================================================

# ----------------------------------------------------------------------------------------------------------------------
# 1. ОСНОВНЫЕ НАСТРОЙКИ ПЛАГИНА И ЛОКАЛИЗАЦИИ
# ----------------------------------------------------------------------------------------------------------------------
settings:
  # Код активного языка интерфейса, чата, всплывающих подсказок над хотбаром (ActionBar), описания пластинок и GUI-меню.
  # Все языковые пакеты хранятся в папке: plugins/SimpleVoiceChatPlate/lang/
  # Из коробки доступны два полных перевода:
  #   • "ru" — Русский язык (стоит по умолчанию).
  #   • "en" — Английский язык (English).
  # Вы также можете создать собственный перевод (например, скопировать ru.yml в uk.yml и указать language: "uk").
  language: "ru"

  # Режим расширенной технической отладки в консоли сервера.
  #   • false — в консоль выводятся только важные события запуска, предупреждения и критические ошибки (рекомендуется).
  #   • true  — подробно логируются все команды запуска yt-dlp/FFmpeg, этапы предзагрузки кэша, переходы потоков и поиск.
  debug: false

# ----------------------------------------------------------------------------------------------------------------------
# 2. СИСТЕМА ЖУРНАЛИРОВАНИЯ И ОТЧЕТОВ ОБ ОШИБКАХ (ЛОГГЕР)
# ----------------------------------------------------------------------------------------------------------------------
logging:
  # Создавать ли отдельные подробные crash-отчеты при сбоях внешних утилит (yt-dlp, FFmpeg) или аудиопотоков.
  # Отчеты сохраняются в папку plugins/SimpleVoiceChatPlate/crash-reports/ с полным контекстом ссылки и кодом возврата.
  create_crash_reports: true

  # Записывать ли постоянный системный журнал работы плагина в текстовые файлы внутри папки logs/ плагина.
  # Помогает администратору отследить историю загрузок и ошибок без поиска по огромному общему логу сервера.
  file_logging: true

  # Срок хранения старых лог-файлов и отчетов об ошибках (в сутках).
  # Все логи старше указанного количества дней автоматически удаляются при запуске и перезагрузке плагина.
  retention_days: 14

# ----------------------------------------------------------------------------------------------------------------------
# 3. КАЧЕСТВО ЗВУКА, ТРАКТ ДЕКОДИРОВАНИЯ FFMPEG И КОДЕК OPUS
# ----------------------------------------------------------------------------------------------------------------------
audio:
  # Пользовательский абсолютный путь к исполняемому файлу FFmpeg на машине сервера (например: "/usr/bin/ffmpeg").
  # Оставьте пустую строку "", чтобы плагин автоматически нашел установленный в системе FFmpeg или использовал
  # бинарный файл из собственной папки plugins/SimpleVoiceChatPlate/bin/.
  ffmpeg_path: ""

  # Профиль студийной обработки и передискретизации звука в FFmpeg (частота Simple Voice Chat — строго 48 000 Гц):
  #   • "ultra"    — Максимальное студийное качество: загрузка потоков 48 кГц Opus ~160 кбит/с и фазолинейный
  #                  64-точечный sinc-интерполятор (cutoff=0.98) с сохранением кристально чистых высоких частот до 19.6 кГц.
  #   • "high"     — Высокое качество с облегченным 32-точечным ресэмплером (снижает нагрузку на слабый CPU при конвертации).
  #   • "balanced" — Стандартная быстрая передискретизация для экономии ресурсов процессора.
  #   • "raw"      — Прямое побитовое декодирование волны без каких-либо фильтров и лимитеров FFmpeg.
  quality_preset: "ultra"

  # Режим работы аппаратно-программного кодека Opus в Simple Voice Chat:
  #   • "AUDIO"               — Широкополосный музыкальный профиль CELT (полный спектр 20 Гц – 20 кГц, плотный саб-бас и чистые верха).
  #   • "VOIP"                — Голосовой профиль SILK (срезает края спектра под речь; НЕ рекомендуется для музыки).
  #   • "RESTRICTED_LOWDELAY" — Профиль сверхнизкой задержки (чуть меньшая глубина психоакустического сжатия).
  opus_mode: "AUDIO"

  # Базовое предусиление аудиодорожки на этапе декодирования FFmpeg (множитель амплитуды от 0.1 до 2.0).
  # Значение 1.0 означает эталонный уровень исходной записи (100%) без искусственного завышения или ослабления.
  output_gain: 1.0

  # Защита от цифрового перегруза (клиппинга и хрипа) на пиках громких басовых треков (alimiter -0.35 dBFS).
  #   • true  — мягко удерживает экстремальные пики выше 0.96, не сжимая динамику тихих и средних участков песни.
  #   • false — полностью отключает защитный потолок амплитуды.
  normalize_audio: true

  # Ручное переопределение цепочки аудиофильтров FFmpeg (параметр -af) для продвинутых звукоинженеров.
  # Оставьте пустую строку "", чтобы использовался автоматический конвейер выбранного выше профиля quality_preset.
  # Пример кастомного фильтра: "highpass=f=20,acompressor=threshold=-14dB:ratio=2,alimiter=limit=0.95"
  custom_ffmpeg_filter: ""

  # Объем стартового буфера в секундах (от 0.4 до 15.0) для мгновенного потокового запуска трека.
  # Как только FFmpeg декодирует первые 1.5 секунды песни, музыка сразу начинает играть в мире, а остальная часть
  # трека параллельно докачивается в фоне без пауз и ожидания скачивания всего файла целиком.
  initial_buffer_seconds: 1.5

  # Скорость обновления анимации точек над хотбаром («⏳ Загрузка.» -> «⏳ Загрузка..» -> «⏳ Загрузка...») в тиках сервера.
  # 20 тиков = 1 секунда; значение 8 тиков (0.4 сек) дает плавную и приятную глазу анимацию ожидания.
  loading_animation_ticks: 8

  # Максимально допустимая длительность одного аудиофайла в секундах (защита от 10-часовых видео и переполнения диска).
  # 1800 секунд = 30 минут. Если видео длиннее, FFmpeg аккуратно обрежет декодирование на этой отметке.
  max_length_seconds: 1800

  # Максимальный размер скачиваемого исходного сжатого медиафайла в байтах при прямом скачивании по URL.
  # 52428800 байт = ровно 50 МБ (защита от попыток загрузить гигабайтные несжатые архивы или фильмы).
  max_download_size_bytes: 52428800

  # Максимальное число одновременно работающих процессов yt-dlp + FFmpeg на сервере.
  # Значение 4 оптимально для большинства серверов: исключает пиковые перегрузки CPU, если 10 игроков одновременно запишут диски.
  max_concurrent_processes: 4

# ----------------------------------------------------------------------------------------------------------------------
# 4. УМНАЯ СИСТЕМА ПЛЕЙЛИСТОВ, РЕКОМЕНДАЦИЙ И ДВУНАПРАВЛЕННОЙ ПРЕДЗАГРУЗКИ
# ----------------------------------------------------------------------------------------------------------------------
playlist:
  # Максимальное количество песен, загружаемых из обычного авторского плейлиста YouTube (PL..., OL...) или папки Google Диска.
  # Допустимый диапазон: от 5 до 500 треков.
  max_tracks: 100

  # Максимальное количество песен при генерации автоматического радио-микса / рекомендаций по песне (RD..., RDAMVM...).
  # Первые 25–35 треков радио YouTube наиболее точно совпадают по языку, жанру и атмосфере с исходной песней;
  # на больших дистанциях (50–100+) алгоритмы YouTube начинают подмешивать посторонние популярные треки.
  radio_max_tracks: 30

  # Сколько первых треков плейлиста достаточно получить от YouTube, чтобы пластинка сразу стала готовой к проигрыванию.
  # Значение 3 позволяет вставить пластинку в проигрыватель уже через ~1 секунду после записи, пока остальные песни
  # списка незаметно догружаются в фоновом режиме и автоматически добавляются в меню плеера.
  initial_ready_tracks: 3

  # Сколько СЛЕДУЮЩИХ песен вперед от текущей позиции (current + 1..N) держать наготове в скользящем окне предзагрузки.
  # При нажатии кнопки «Следующий трек (⏭)» или естественном окончании песни старт происходит за 0 мс без задержки.
  prefetch_next_tracks: 3

  # Сколько ПРЕДЫДУЩИХ песен назад от текущей позиции (current - 1..M) держать наготове в скользящем окне предзагрузки.
  # Позволяет мгновенно (за 0 мс) вернуться к прошлым трекам кнопкой «Предыдущий трек (⏮)».
  prefetch_previous_tracks: 2

  # Длительность предзагружаемого начала («вступления», .head.pcm) в секундах для каждой соседней песни окна (вперед и назад).
  # Загружается только легкий 12-секундный фрагмент (~200 КБ), а когда игрок реально переключается на этот трек или
  # слушает текущий трек дольше 5 секунд, система бесшовно докачивает полную версию песни в фоне.
  head_preload_seconds: 12

  # Автоматический переход к рекомендациям на основе самой песни, если оригинальный плейлист в ссылке недоступен,
  # удален, скрыт настройками приватности или пуст (при условии, что в ссылке указан конкретный ролик v=...).
  # Также вы можете принудительно создать плейлист рекомендаций по любой одиночной песне префиксом mix:<ссылка>.
  fallback_to_song_radio: true

  # Чистый «приватный режим» (Инкогнито) при формировании радио-миксов и рекомендаций по песне (RD..., RDMM..., RDAMVM...).
  #   • true  — миксы запрашиваются строго БЕЗ cookies.txt, без кэша и без истории просмотров аккаунта с жесткой привязкой
  #             исключительно к самой песне (как в приватном окне браузера), чтобы рекомендации подбирались универсально
  #             по жанру, стилю и языку конкретного трека без примеси истории чужого серверного аккаунта.
  #   • false — использовать cookies.txt даже для динамических миксов (рекомендации будут зависеть от истории аккаунта).
  incognito_radio_recommendations: true

  # Режим языковой адаптации алгоритма рекомендаций YouTube для любых песен мира:
  #   • "auto" — УНИВЕРСАЛЬНЫЙ РЕЖИМ (рекомендуется): автоматически определяет язык/алфавит самой песни по ее метаданным
  #              (английские, украинские, русские, японские, корейские, польские, инструментальные и любые другие треки)
  #              и не навязывает чужой язык или регион хостинга.
  #   • "none" — полностью нейтральный запрос без языковых подсказок.
  #   • "en" / "ru" / "uk" / "ja" и т.д. — жестко зафиксировать один конкретный язык ISO 639-1 (только если нужно вручную).
  recommendation_lang: "auto"

  # Принудительный региональный код страны (ISO 3166-1 alpha-2, 2 заглавные буквы) для геолокации радио-рекомендаций.
  # Оставьте пустым "" (по умолчанию) для универсальной работы с музыкой на любых языках без привязки к одной стране.
  recommendation_country: ""

# ----------------------------------------------------------------------------------------------------------------------
# 5. ФИЗИЧЕСКИЙ ДВИЖОК РЕАЛИСТИЧНОЙ 3D-АКУСТИКИ (СТЕНЫ, ПЛАВНОСТЬ, ДИФРАКЦИЯ, ВОДА)
# ----------------------------------------------------------------------------------------------------------------------
acoustics:
  # Главный переключатель системы пространственной 3D-акустики.
  #   • true  — рассчитывает преграды, огибание углов и подводное глушение индивидуально для каждого слушателя.
  #   • false — звук проходит сквозь любые стены без фильтрации с обычным линейным затуханием по расстоянию.
  enabled: true

  # Прохождение и реалистичное приглушение звука сквозь стены, полы и потолки (воксельная трассировка 3D DDA).
  # Плотные блоки (камень, глубинный сланец, обсидиан, шерсть) поглощают высокие и средние частоты сильнее,
  # а тонкие преграды (стекло, двери, листва, ковры) пропускают значительно больше звука.
  through_walls: true

  # Объемная многолучевая трассировка звуковой волны (5 лучей апертуры вместо одного тонкого луча-лазера).
  #   • true  — заранее улавливает края дверных проемов, окон и углов коридора, устраняя резкую ступеньку громкости
  #             на границе блока при быстром движении игрока (пешком, на лодке, вагонетке или элитрах).
  #   • false — одиночный центральный луч (чуть меньше нагрузка на CPU, но переходы на углах блоков более резкие).
  volumetric_rays: true

  # Время плавного акустического перехода (в миллисекундах, от 80 до 3000 мс) при изменении преград между источником и игроком.
  # Сглаживает громкость в децибелах (лог-шкала слуха) и частоту среза фильтра по октавам: когда вы подъезжаете или
  # выходите из-за нескольких стен к проигрывателю, звук раскрывается мягко и естественно без резкого удара по ушам.
  # Значение 650 мс (0.65 сек) идеально имитирует реальную акустическую инерцию помещения и улицы.
  transition_time_ms: 650

  # Волновая дифракция звука (огибание преград через ближайшие открытые двери, окна, арки и углы коридоров).
  # Если прямая линия перекрыта глухой стеной, но рядом открыта дверь, звук плавно обогнет угол и клиентский 3D OpenAL
  # позиционирует источник со стороны дверного проема.
  diffraction_enabled: true

  # Легкая камерная реверберация (ранние отражения) внутри полностью замкнутых каменных комнат и пещер.
  #   • false — отключено по умолчанию для сохранения эталонной студийной чистоты записи без комнатного окрашивания.
  #   • true  — добавляет деликатный объем (до 8%), когда источник окружен плотными стенами, полом и потолком.
  room_reverb_enabled: false

  # Атмосферное поглощение ультравысоких частот воздухом на больших открытых расстояниях (свыше 38 блоков).
  #   • false — звук на любой дистанции в прямой видимости остается максимально прозрачным и звонким.
  #   • true  — на дальних рубежах (40+ блоков) верха слегка смягчаются, как на открытом концерте вдали от сцены.
  air_absorption_enabled: false

  # Эффект глубокого приглушения звука при погружении головы слушателя под воду (срез частот выше ~390 Гц).
  underwater_muffle: true

  # Общий множитель силы глушения звука стенами (от 0.0 до 3.0).
  #   • 1.0 — физически сбалансированная проницаемость блоков (рекомендуется).
  #   • 0.5 — стены глушат звук в два раза слабее (музыку лучше слышно в соседних домах).
  #   • 1.5 — повышенная звукоизоляция стен.
  wall_muffle_strength: 1.0

  # Коэффициент структурного низкочастотного резонанса баса (~95 Гц) сквозь массивные стены (от 0.0 до 2.0).
  # Создает реалистичный эффект «клубного сабвуфера за стеной», когда верха приглушены, но мягкая вибрация баса ощущается.
  wall_bass_resonance: 0.85

  # Минимальный порог остаточной слышимости за несколькими слоями стен (от 0.0 до 1.0, где 0.04 = 4% от текущей громкости),
  # прежде чем звук окончательно затухнет в ноль за сверхтолстой преградой (> 36–60 дБ потерь).
  min_wall_gain: 0.04

  # Интервал пересчета акустических лучей и 3D-позиций для активных источников (в тиках сервера, 1 тик = 50 мс).
  # Значение 2 тика (100 мс, 10 раз в секунду) в связке с transition_time_ms обеспечивает бесшовную плавность в движении.
  update_interval_ticks: 2

# ----------------------------------------------------------------------------------------------------------------------
# 6. ХРАНЕНИЕ ФАЙЛОВ И АВТОМАТИЧЕСКАЯ ОЧИСТКА АУДИО-КЭША
# ----------------------------------------------------------------------------------------------------------------------
folders:
  # Имя подпапки внутри plugins/SimpleVoiceChatPlate/, где хранятся сконвертированные .pcm треки, превью (.head.pcm) и временные файлы.
  cache: "cache"

cache:
  # Автоматически ли удалять с диска старые треки, которые никто не включал дольше retention_days.
  auto_cleanup: true

  # Сколько дней хранить неиспользуемый трек в кэше с момента его последнего воспроизведения (при каждом проигрывании таймер обновляется).
  retention_days: 7

  # Периодичность запуска фоновой проверки устаревших файлов кэша в тиках сервера (1200 тиков = раз в 1 минуту).
  cleanup_delay_ticks: 1200

# ----------------------------------------------------------------------------------------------------------------------
# 7. ЗАГРУЗЧИК YOUTUBE (YT-DLP) И СЕТЕВАЯ БЕЗОПАСНОСТЬ
# ----------------------------------------------------------------------------------------------------------------------
youtube:
  # Разрешить ли загрузку треков, плейлистов и поиск музыки напрямую с YouTube / YouTube Music.
  enabled: true

  # Пользовательский путь к исполняемому файлу yt-dlp.
  # Оставьте "", чтобы плагин автоматически скачал и использовал актуальный yt-dlp в папке plugins/SimpleVoiceChatPlate/bin/.
  ytdlp_path: ""

  # Резервные профили клиентов YouTube (перебираются автоматически, если нативный профиль столкнулся с защитой HTTP 403).
  # Для скачивания видео 18+ или обхода жестких блокировок IP дата-центра положите файл cookies.txt (формат Netscape)
  # в корень папки плагина: plugins/SimpleVoiceChatPlate/cookies.txt
  player_clients: "mweb,web,ios,android"

  # Дополнительные низкоуровневые аргументы --extractor-args для yt-dlp (оставьте "", если не требуется спец-настройка).
  extractor_args: ""

  # Автоматически ли проверять и обновлять бинарный файл yt-dlp в фоне при запуске сервера (крайне рекомендуется true,
  # так как YouTube регулярно меняет алгоритмы шифрования потоков). Вручную обновить можно командой /svcplate updatedeps.
  auto_update: true

blacklist:
  # Список запрещенных доменов и локальных адресов (защита от SSRF-атак на внутреннюю локальную сеть хостинга).
  # Любые прямые ссылки на эти хосты будут заблокированы при попытке записи пластинки.
  domains:
    - "localhost"
    - "127.0.0.1"
    - "0.0.0.0"

# ----------------------------------------------------------------------------------------------------------------------
# 8. МУЗЫКАЛЬНЫЕ ПРОИГРЫВАТЕЛИ (JUKEBOX) И ПИРАМИДА-УСИЛИТЕЛЬ
# ----------------------------------------------------------------------------------------------------------------------
jukebox:
  # Начальная (стартовая) громкость проигрывателя при установке пластинки (множитель от 0.0 до 1.5, где 0.20 = 20%, 1.00 = 100%).
  # Значение 0.20 ставит комфортные 20% по умолчанию. Если игрок изменит громкость в меню проигрывателя (Shift + ПКМ),
  # выбранная им громкость сохранится на всю сессию и НЕ сбросится при переходе к следующим песням плейлиста!
  volume_multiplier: 0.20

  # Базовый радиус слышимости проигрывателя в блоках (если пирамида-усилитель отключена или не построена).
  distance: 65.0

  # Выбрасывать ли кастомную пластинку как предмет при разрушении блока проигрывателя игроком или взрывом.
  drop_disc_on_break: true

  # Показывать ли игрокам поблизости анимацию «⏳ Загрузка. / .. / ...» над хотбаром, пока холодный трек буферизуется.
  show_loading_animation: true

  # Показывать ли игрокам поблизости уведомление «🎶 Сейчас играет: <название>» над хотбаром при старте каждой песни.
  show_playing_notification: true

  # Включить ли механику акустической пирамиды под проигрывателем (аналогично ванильному Маяку / Beacon).
  # Слои 3x3, 5x5, 7x7 и 9x9 под проигрывателем из железных, золотых, медных (любых видов), изумрудных, алмазных
  # или незеритовых блоков ступенчато увеличивают дальность распространения звука.
  enable_beacon_like_distance: true

  # Таблица радиусов слышимости (в блоках) по уровням построенной под проигрывателем пирамиды:
  #   • 1-е число (48)  — 0 уровней (обычный проигрыватель без пирамиды; берется максимум между этим числом и jukebox.distance).
  #   • 2-е число (64)  — 1 уровень пирамиды (слой 3x3 под проигрывателем).
  #   • 3-е число (84)  — 2 уровня пирамиды (слои 3x3 и 5x5).
  #   • 4-е число (108) — 3 уровня пирамиды (слои 3x3, 5x5 и 7x7).
  #   • 5-е число (136) — 4 полных уровня пирамиды (слои 3x3, 5x5, 7x7 и 9x9).
  beacon_like_distances:
    - 48
    - 64
    - 84
    - 108
    - 136

# ----------------------------------------------------------------------------------------------------------------------
# 9. КАСТОМНЫЕ ЗВУКОВЫЕ КОЗЬИ РОГА (САУНДПАД)
# ----------------------------------------------------------------------------------------------------------------------
goat_horn:
  # Разрешить ли использование записанных кастомных козьих рогов на сервере.
  enabled: true

  # Начальная громкость козьего рога по умолчанию (от 0.05 до 1.5, где 0.20 = 20%, 1.00 = 100%).
  # Игрок также может настроить громкость конкретного рога в руке командой: /svcplate horn volume <5..150>
  volume_multiplier: 0.20

  # Радиус слышимости козьего рога по умолчанию в блоках (настраивается индивидуально через /svcplate horn distance).
  distance: 24.0

  # Максимальная длительность одного проигрывания рога по умолчанию в секундах (настраивается через /svcplate horn duration).
  max_duration_seconds: 15

  # Кулдаун (перезарядка) между запусками козьего рога в тиках сервера (100 тиков = 5 секунд).
  cooldown_ticks: 100

  # Режим работы правого клика (ПКМ) по рогу по умолчанию (можно переключить на конкретном роге через /svcplate horn mode):
  #   • "toggle"  — Переключатель: первый ПКМ запускает звук, повторный ПКМ сразу останавливает его (без зажатия Shift).
  #   • "restart" — Перезапуск: ПКМ перезапускает звук с начала после кулдауна, а остановка выполняется через Shift + ПКМ.
  default_mode: "toggle"

  # Показывать ли владельцу рога анимацию «⏳ Загрузка. / .. / ...» над хотбаром при первичной подгрузке звука.
  show_loading_animation: true

  # Показывать ли надпись «🎺 Воспроизведение запущено!» над хотбаром (глобальный переключатель для всего сервера;
  # каждый отдельный игрок может выключить ее лично для себя командой /svcplate horn notify off).
  show_playing_notification: true

  # Показывать ли надпись «⏹ Звук рога остановлен» над хотбаром при ручной остановке рога.
  show_stopped_notification: true

# ----------------------------------------------------------------------------------------------------------------------
# 10. ПОРТАТИВНЫЙ ПЛЕЕР (ПРОСЛУШИВАНИЕ ПЛАСТИНКИ ПРЯМО С РУКИ)
# ----------------------------------------------------------------------------------------------------------------------
portable_player:
  # Разрешить ли запускать музыку нажатием ПКМ по воздуху с кастомной пластинкой в основной руке (остановка: Shift + ПКМ).
  # По умолчанию выключено (false), чтобы музыка воспроизводилась классически через блоки проигрывателей и рога.
  enabled: false

  # Начальная громкость портативного плеера (от 0.0 до 1.5, где 0.20 = 20%).
  volume_multiplier: 0.20

  # Радиус слышимости портативного плеера вокруг идущего игрока в блоках.
  distance: 18.0

  # Показывать ли анимацию «⏳ Загрузка...» над хотбаром при запуске портативного плеера.
  show_loading_animation: true

  # Показывать ли уведомление «🎧 Портативный плеер запущен!» над хотбаром.
  show_playing_notification: true

  # Показывать ли уведомление «⏹ Портативный плеер остановлен» при остановке через Shift + ПКМ.
  show_stopped_notification: true

# ----------------------------------------------------------------------------------------------------------------------
# 11. МЕХАНИКА ЗАПИСИ И ОЧИСТКИ ПРЕДМЕТОВ ЧЕРЕЗ НАКОВАЛЬНЮ
# ----------------------------------------------------------------------------------------------------------------------
anvil:
  # Разрешить ли записывать ссылки переименованием пластинки/рога в наковальне (формат: ссылка|Название)
  # и стирать записи совмещением пластинки с ножницами во втором слоте наковальни.
  enabled: true

  # Сколько единиц прочности отнимать у ножниц при одной очистке кастомной пластинки в наковальне
  # (у обычных железных ножниц 238 прочности: значение 34 позволяет стереть ровно 7 пластинок одними ножницами).
  shears_damage: 34

# ----------------------------------------------------------------------------------------------------------------------
# 12. СИСТЕМА «ЧИСТЫХ ПЛАСТИНОК» (ОПЦИОНАЛЬНОЕ ОГРАНИЧЕНИЕ КРАФТОМ ДЛЯ ВЫЖИВАНИЯ)
# ----------------------------------------------------------------------------------------------------------------------
burnable_tag:
  # Требовать ли специальную скрытую метку «чистой пластинки» (PDC burnable) для записи музыки:
  #   • false — игроки могут записывать музыку на любые ванильные пластинки и козьи рога (по умолчанию).
  #   • true  — обычные пластинки из данжей записать нельзя, пока они не подготовлены по рецепту ниже (или выданы плагином).
  #             Администраторы с правом simplevoicechatplate.burn.bypass обходят это требование.
  require_burnable_tag: false

  # Зарегистрировать ли на сервере встроенный бесформенный крафт подготовки «чистой пластинки» на верстаке
  # (любая ванильная музыкальная пластинка + указанное ниже количество ресурса default_recipe_item).
  enable_default_recipe: false

  # Материал ингредиента для крафта чистой пластинки (принимается любой ID предмета Minecraft, например "minecraft:diamond").
  default_recipe_item: "minecraft:diamond"

  # Количество единиц предмета default_recipe_item, необходимое в сетке верстака (от 1 до 8).
  default_recipe_cost: 4

  # Строка описания (Lore в формате MiniMessage), которая добавляется подготовленной чистой пластинке после крафта.
  default_recipe_lore: "<aqua>Чистая пластинка для записи</aqua>"

# ----------------------------------------------------------------------------------------------------------------------
# 13. ИНТЕРАКТИВНОЕ ГРАФИЧЕСКОЕ МЕНЮ ПРОИГРЫВАТЕЛЯ (SHIFT + ПКМ ПО JUKEBOX)
# ----------------------------------------------------------------------------------------------------------------------
gui:
  # Шаг быстрой перемотки трека вперед/назад по кнопкам компаса в меню плеера (в секундах; кнопки часов перематывают на 5 сек).
  rewind_seconds: 15

  # Малый шаг плавной регулировки громкости кнопками редстоуна / светопыли (0.05 = изменение на ±5% за клик).
  volume_small_step: 0.05

  # Большой шаг регулировки громкости кнопками редстоун-блока / светокамня (0.15 = изменение на ±15% за клик).
  volume_large_step: 0.15

  # Длина визуальной полосы прогресса времени трека («━━━━━━...») в символах внутри меню (от 5 до 40).
  progress_bar_length: 22

# ----------------------------------------------------------------------------------------------------------------------
# 14. КВОТЫ И ЛИМИТЫ СОЗДАНИЯ ПРЕДМЕТОВ НА ОДНОГО ИГРОКА
# ----------------------------------------------------------------------------------------------------------------------
# При очистке предмета (/svcplate erase или ножницами в наковальне) занятый слот квоты автоматически возвращается автору!
# Для выдачи персональных/донатных лимитов через LuckPerms используйте права формата:
#   • simplevoicechatplate.limit.single.<число>   (например, simplevoicechatplate.limit.single.25)
#   • simplevoicechatplate.limit.playlist.<число> (укажите -1 для полного безлимита: simplevoicechatplate.limit.playlist.-1)
#   • simplevoicechatplate.limit.horn.<число>     (игроки с правом simplevoicechatplate.admin также имеют безлимит)
limits:
  # Максимальное количество записанных одиночных пластинок на одного обычного игрока по умолчанию.
  single: 5

  # Максимальное количество записанных пластинок-плейлистов на одного обычного игрока по умолчанию.
  playlist: 2

  # Максимальное количество записанных звуковых козьих рогов на одного обычного игрока по умолчанию.
  horn: 3
