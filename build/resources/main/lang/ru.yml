  unknown: "Неизвестно"

# Сетевой протокол Simple Voice Chat (AddCategoryPacket) жестко ограничивает поле name категории
# максимум 16 байтами UTF-8 (не более 8 кириллических или 16 латинских символов). Полное описание
# выводится во всплывающей подсказке (category_*_desc, до 256 байт UTF-8).
voicechat:
  category_music_name: "Музыка"
  category_music_desc: "Громкость музыкальных пластинок SimpleVoiceChatPlate"
  category_horn_name: "Рога"
  category_horn_desc: "Громкость кастомных рогов и портативного плеера"

